<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>學測英文</title>
<meta name="description" content="學測英文一站式入口：學測倒數、Level 4–6 單字間隔複習、英文作文兩段框架。">
<meta name="theme-color" content="#fff4e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 繪本風：奶油底、深可可色手繪線、粉彩貼紙卡片＋原創小麻糬吉祥物 */
:root{
  --bg:#fff4e6; --dot:#f6dcc0; --card:#fffdf8; --ink:#5b4436; --soft:#8a6f5e; --line:#5b4436;
  --pink:#ffc9d6; --pink-ink:#d9576f; --blue:#cfe6ff; --blue-ink:#3f7cc4; --mint:#d4f0dc; --yellow:#fff1a6;
  --f:"Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2b211c; --dot:#3a2d26; --card:#382b24; --ink:#f6e7d8; --soft:#cdb4a2; --line:#f6e7d8;
  --pink:#6b3a47; --pink-ink:#ff9fb3; --blue:#2f4560; --blue-ink:#9cc8ff; --mint:#2e4a37; --yellow:#5a4f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2b211c; --dot:#3a2d26; --card:#382b24; --ink:#f6e7d8; --soft:#cdb4a2; --line:#f6e7d8;
  --pink:#6b3a47; --pink-ink:#ff9fb3; --blue:#2f4560; --blue-ink:#9cc8ff; --mint:#2e4a37; --yellow:#5a4f22; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;min-height:100vh;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
p,h1,h2{margin:0}
h1,h2{font-weight:400;line-height:1.3;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* 頂列 */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:1.25rem;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:6px}
.brand i{font-style:normal;color:var(--pink-ink)}
.top nav{display:flex;gap:8px}
.top nav a{color:var(--ink);text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:2px 12px;background:var(--card);font-size:.92rem}

/* 吉祥物＋對話框 */
.hero{margin-top:2px}
.pic{display:block;width:100%;height:auto;background:#fff;border:3px solid var(--line);border-radius:24px;box-shadow:4px 4px 0 var(--line)}
.bubble{position:relative;width:fit-content;max-width:100%;margin:0 auto 14px;text-align:center;
  background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:8px 16px;font-size:1rem}
.bubble::before{content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;background:var(--card);
  border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:translateX(-50%) rotate(-45deg);border-radius:0 0 0 4px}

/* 倒數貼紙 */
.count{position:relative;background:var(--pink);border:3px solid var(--line);border-radius:24px;padding:16px 20px 14px;
  box-shadow:4px 4px 0 var(--line);text-align:center}
.count-k{font-size:1.05rem}
.count-n{display:flex;justify-content:center;align-items:baseline;gap:8px;line-height:1.05}
.count-n b{font-weight:400;font-size:clamp(4.2rem,22vw,5.6rem);color:var(--pink-ink);font-variant-numeric:tabular-nums;
  -webkit-text-stroke:2px var(--line);paint-order:stroke fill;letter-spacing:.02em}
.count-n span{font-size:1.5rem}
.count-sub{font-size:.98rem}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0;padding:0}
.dates div{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:6px 8px}
.dates dt{font-size:.8rem;color:var(--soft)}
.dates dd{margin:0;font-size:clamp(.8rem,3.9vw,1rem);white-space:nowrap;font-variant-numeric:tabular-nums}
.spark{position:absolute;width:26px;height:26px;fill:var(--yellow);stroke:var(--line);stroke-width:2.5;stroke-linejoin:round}
.spark.a{top:-12px;right:18px;transform:rotate(12deg)}
.spark.b{top:22px;left:-12px;width:20px;height:20px;transform:rotate(-14deg)}

/* 選單卡片 */
.ask{font-size:1.2rem;display:flex;align-items:center;gap:8px;margin-top:4px}
.tiles{display:grid;gap:16px}
.tile{display:grid;grid-template-columns:56px 1fr;gap:4px 14px;align-items:start;text-decoration:none;color:var(--ink);
  background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:4px 4px 0 var(--line);
  transition:transform .12s, box-shadow .12s}
.tile:hover{transform:translate(-1px,-2px);box-shadow:5px 6px 0 var(--line)}
.tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.tile:focus-visible{outline:3px solid var(--blue-ink);outline-offset:3px}
.ico{grid-row:span 3;width:56px;height:56px;border:2.5px solid var(--line);border-radius:18px;display:grid;place-items:center}
.ico svg{width:34px;height:34px;fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.vocab .ico{background:var(--blue)}
.essay .ico{background:var(--mint)}
.tile h2{font-size:1.25rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tile h2 span{font-size:.85rem;color:var(--soft)}
.tile p{font-size:.92rem;color:var(--soft)}
.tile .now{color:var(--ink);background:var(--yellow);border-radius:10px;padding:2px 8px;justify-self:start;margin-top:4px}
.tile .now b{font-weight:400;color:var(--pink-ink);font-variant-numeric:tabular-nums}
.tile .now b.n{color:var(--blue-ink)}
.foot{text-align:center;font-size:.8rem;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./"><i aria-hidden="true">✿</i>學測英文</a>
    <nav aria-label="主選單"><a href="vocab/">單字</a><a href="essay/">作文</a></nav>
  </header>

  <div class="hero">
    <p class="bubble" id="say">今天也一起加油吧！</p>
    <img class="pic" src="img/chiikawa.png" width="1120" height="688" alt="ちいかわ、小八、烏薩奇趴在地上一起畫畫">
  </div>

  <section class="count" aria-label="學測倒數">
    <svg class="spark a" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z"/></svg>
    <svg class="spark b" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z"/></svg>
    <p class="count-k">距離學測還有</p>
    <p class="count-n"><b id="cd-days">–</b><span id="cd-unit">天</span></p>
    <p class="count-sub" id="cd-sub"></p>
    <dl class="dates">
      <div><dt>今天</dt><dd id="today"></dd></div>
      <div><dt>學測</dt><dd>2027/1/22（五）</dd></div>
    </dl>
  </section>

  <h1 class="ask">今天要做什麼呢？</h1>

  <div class="tiles">
    <a class="tile vocab" href="vocab/">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="13" rx="2.5"/><path d="M7 3h11.5A2.5 2.5 0 0 1 21 5.5V16"/><path d="M7 15l3-7 3 7M8.2 12.5h3.6"/></svg></span>
      <h2>單字複習 <span>Level 4–6 →</span></h2>
      <p>3,252 字，間隔複習，附例句和發音。</p>
      <p class="now" id="vocab-now">還沒開始：先做「快速篩選」吧</p>
    </a>
    <a class="tile essay" href="essay/">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19H5v-4z"/><path d="M13.5 6.5l4 4"/></svg></span>
      <h2>作文框架 <span>兩段式 →</span></h2>
      <p>固定格子、轉承語、句子升級，附示範句。</p>
    </a>
  </div>

  <p class="foot">一起背單字 ✿</p>
</div>

<script>
(function () {
  var d = new Date(), t = Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
  var td = new Date(t * 86400000);
  document.getElementById('today').textContent = td.getUTCFullYear() + '/' + (td.getUTCMonth() + 1) + '/' + td.getUTCDate() + '（' + '日一二三四五六'[td.getUTCDay()] + '）';

  // 學測倒數：2027-01-22（考兩天，到 1/23）
  var exam = Date.UTC(2027, 0, 22) / 86400000, daysLeft = exam - t;
  var cdK = document.querySelector('.count-k'), cdD = document.getElementById('cd-days'),
      cdU = document.getElementById('cd-unit'), cdS = document.getElementById('cd-sub'), say = document.getElementById('say');
  if (daysLeft > 0) {
    cdD.textContent = daysLeft;
    cdS.textContent = '也就是 ' + Math.floor(daysLeft / 7) + ' 週又 ' + (daysLeft % 7) + ' 天';
    say.textContent = daysLeft <= 7 ? '最後衝刺！早點睡也很重要喔' :
      daysLeft <= 30 ? '剩不到一個月了，每天都要複習喔！' : '今天也一起背幾個字吧！';
  } else if (daysLeft >= -1) {
    cdK.textContent = '學測'; cdD.textContent = '今天'; cdU.textContent = '';
    cdS.textContent = '把會的都寫上去！'; say.textContent = '加油加油！你可以的！';
  } else {
    cdK.textContent = '2027 學測'; cdD.textContent = '完成'; cdU.textContent = '';
    cdS.textContent = '辛苦了，好好休息一下'; say.textContent = '考完了！辛苦了～';
  }

  var s = null;
  try { s = JSON.parse(localStorage.getItem('gsat-vocab-v1')); } catch (e) {}
  if (!s || !s.cards || !Object.keys(s.cards).length) return;
  var due = 0;
  Object.keys(s.cards).forEach(function (k) { if (s.cards[k].due <= t) due++; });
  var per = (s.set && s.set.newPerDay) || 20;
  var done = s.daily && s.daily.day === t ? s.daily.newDone : 0;
  document.getElementById('vocab-now').innerHTML =
    '今天：到期 <b>' + due + '</b> 字・新字 <b class="n">' + Math.max(0, per - done) + '</b> 字';
})();
</script>
</body>
</html>
